name: insert-dragonfly-hook-into-triton

# Layers the released dragonfly hook (.so) onto any Triton base tag and pushes to GHCR.
# The .so is the fixed `dragonfly-hook` release asset (produced by build-dragonfly-hook.yml).

on:
  workflow_dispatch:
    inputs:
      triton_tag:
        description: "Full Triton image tag, e.g. 26.07-py3 or 26.07-trtllm-python-py3"
        required: true
        default: "26.07-py3"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve names
        id: meta
        run: |
          TAG="${{ github.event.inputs.triton_tag }}"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          SO_URL="https://github.com/${{ github.repository }}/releases/download/dragonfly-hook/libtritonrepoagent_dragonfly.so"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "so_url=$SO_URL" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER}/tritonserver-dragonfly:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify the hook asset exists
        run: |
          if ! curl -sfIL "${{ steps.meta.outputs.so_url }}" >/dev/null; then
            echo "::error::Hook asset not found: ${{ steps.meta.outputs.so_url }}"
            echo "Run build-dragonfly-hook.yml first."
            exit 1
          fi

      # Triton base is ~20 GB unpacked; default runner free space (~14 GB) is not enough.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache
          sudo docker image prune -af || true
          df -h /

      - name: Generate Dockerfile
        run: |
          cat > Dockerfile.runtime <<EOF
          FROM nvcr.io/nvidia/tritonserver:${{ steps.meta.outputs.tag }}
          RUN mkdir -p /opt/tritonserver/repoagents/dragonfly
          ADD ${{ steps.meta.outputs.so_url }} /opt/tritonserver/repoagents/dragonfly/libtritonrepoagent_dragonfly.so
          RUN chmod 644 /opt/tritonserver/repoagents/dragonfly/libtritonrepoagent_dragonfly.so
          EOF
          cat Dockerfile.runtime

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build & push ${{ steps.meta.outputs.image }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          tags: ${{ steps.meta.outputs.image }}

      - name: Summary
        run: |
          {
            echo "### Pushed \`${{ steps.meta.outputs.image }}\`"
            echo
            echo "Run it:"
            echo '```bash'
            echo "docker run --rm --gpus all -p8000-8002:8000-8002 \\"
            echo "  -v /path/to/model_repository:/models \\"
            echo "  ${{ steps.meta.outputs.image }} \\"
            echo "  tritonserver --model-repository=/models"
            echo '```'
            echo
            echo "Enable per-model in \`config.pbtxt\`:"
            echo '```'
            echo 'model_repository_agents { agents [ { name: "dragonfly" } ] }'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
