name: Build Dragonfly Triton Agent

# Compiles the Dragonfly Triton repository agent (.so) for an arbitrary Triton
# version and publishes it to Releases. Re-run with a new triton_version to get
# the agent for that release: it fetches triton core/common r<version> and builds
# the plugin against it. Only the Dockerfile `builder` stage runs here, so there
# is no multi-GB Triton base pull and no NGC auth needed.

on:
  workflow_dispatch:
    inputs:
      triton_version:
        description: "Triton NGC version (YY.MM), e.g. 26.06"
        required: true
        default: "26.06"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve names
        id: meta
        run: |
          V="${{ github.event.inputs.triton_version }}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}-py3" >> "$GITHUB_OUTPUT"
          echo "asset=libtritonrepoagent_dragonfly-${V}-py3.so" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Build+cache the vcpkg deps stage on its own. This step succeeds independently
      # of the agent compile, so its cache is exported even when a later compile fails
      # (build-push-action only exports cache on success). Result: the ~45 min vcpkg
      # build happens once; every retry restores it and only recompiles the agent.
      - name: Build & cache vcpkg deps for Triton ${{ steps.meta.outputs.version }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: deps
          load: false
          cache-from: type=gha,scope=deps-${{ steps.meta.outputs.version }}
          cache-to: type=gha,mode=max,scope=deps-${{ steps.meta.outputs.version }}

      - name: Build agent .so (Dockerfile builder stage) for Triton ${{ steps.meta.outputs.version }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: builder
          load: true
          tags: dragonfly-agent-builder:${{ steps.meta.outputs.version }}
          build-args: |
            TRITON_VERSION=${{ steps.meta.outputs.version }}
          # Restore deps from the step above; keep a builder-scope cache for the
          # incremental compile layers too.
          cache-from: |
            type=gha,scope=deps-${{ steps.meta.outputs.version }}
            type=gha,scope=builder-${{ steps.meta.outputs.version }}
          cache-to: type=gha,mode=max,scope=builder-${{ steps.meta.outputs.version }}

      - name: Extract the .so
        run: |
          cid=$(docker create dragonfly-agent-builder:"${{ steps.meta.outputs.version }}")
          docker cp "$cid:/dragonfly-repository-agent/build/libtritonrepoagent_dragonfly.so" "${{ steps.meta.outputs.asset }}"
          docker rm "$cid"
          ls -lh "${{ steps.meta.outputs.asset }}"

      - name: Publish to Releases
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body: |
            Dragonfly Triton repository agent compiled against Triton ${{ steps.meta.outputs.version }} (core/common `r${{ steps.meta.outputs.version }}`).

            Layer it onto the matching Triton image:

            ```dockerfile
            FROM nvcr.io/nvidia/tritonserver:${{ steps.meta.outputs.version }}-py3
            RUN mkdir -p /opt/tritonserver/repoagents/dragonfly
            COPY ${{ steps.meta.outputs.asset }} /opt/tritonserver/repoagents/dragonfly/libtritonrepoagent_dragonfly.so
            ```

            Then add to the model's `config.pbtxt`:

            ```
            model_repository_agents { agents [ { name: "dragonfly" } ] }
            ```
          files: ${{ steps.meta.outputs.asset }}
